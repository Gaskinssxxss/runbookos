api_version: runbookos/v1
kind: Runbook
metadata:
  id: web-server-health
  name: Web server health
  description: Read-only check of Nginx, disk capacity, and failed systemd units.
  risk: low
targets: [example-web-01]
parameters:
  max_used_percent:
    type: integer
    required: false
    default: 85
    minimum: 1
    maximum: 99
preflight:
  - id: preflight-failed-units
    action: systemd.failed_units
    verify:
      - path: data.units
        operator: empty
steps:
  - id: nginx-active
    action: systemd.is_active
    with: {unit: nginx.service}
    verify:
      - path: data.active
        operator: is_true
  - id: root-disk-capacity
    action: os.disk
    with: {path: /}
    verify:
      - path: data.percent
        operator: lte
        value: "$param.max_used_percent"
postflight:
  - id: nginx-postflight
    action: systemd.is_active
    with: {unit: nginx.service}
    verify: [{path: data.active, operator: is_true}]
