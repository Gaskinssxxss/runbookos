api_version: runbookos/v1
kind: Runbook
metadata:
  id: network-dns-tls-review
  name: Bounded network, DNS and TLS review
  description: Compares DNS, outbound TCP and certificate signals for one inventory endpoint.
  risk: low
targets: [example-web-01]
steps:
  - id: local-routes
    action: network.routes
    timeout_seconds: 5
  - id: dns-resolution
    action: network.dns_resolve
    with: {endpoint_id: service_health}
    timeout_seconds: 5
  - id: tcp-connectivity
    action: network.tcp_connect
    with: {endpoint_id: service_health}
    timeout_seconds: 5
  - id: certificate
    action: network.tls_certificate
    with: {endpoint_id: service_health}
    timeout_seconds: 10
