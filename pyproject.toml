[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runbookos"
version = "0.4.0"
description = "A safe, auditable runbook and infrastructure diagnostic evaluation engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "RunbookOS contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "build>=1.2,<2", "ruff>=0.8,<1"]

[project.scripts]
runbookos = "runbookos.cli:app"
runbookos-alertmanager-bridge = "runbookos.adapters.alertmanager_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/runbookos/config" = [
  "config/diagnostic-taxonomy.v2.example.yml",
  "config/evaluation.qwen.example.yml",
  "config/inventory.example.yml",
  "config/investigation.example.yml",
  "config/policy.example.yml",
  "config/ssh_profiles.example.yml",
  "config/webhook-legacy-single-source.example.yml",
  "config/webhook-sources.example.yml",
]
"share/runbookos/examples/runbooks" = ["examples/runbooks/*.yml"]
"share/runbookos/examples/alerts" = ["examples/alerts/*.json"]
"share/runbookos/examples/alertmanager" = ["examples/alertmanager/*.yml"]
"share/runbookos/scenarios" = ["scenarios/*.yml"]
"share/runbookos/scenarios/metadata" = ["scenarios/metadata/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: opt-in, read-only SSH integration tests against managed hosts",
  "live_probe: opt-in, read-only endpoint probes requiring exact endpoint approval",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
