schema_version: 1
default_decision: deny
approval:
  required_for_remediation: true
  ttl_seconds: 900
  one_time: true
hosts:
  example-web-01:
    diagnostic_actions:
      - systemd.is_active
      - systemd.service_status
      - systemd.failed_units
      - systemd.journal_summary
      - systemd.timers
      - os.uptime
      - os.cpu
      - os.release
      - os.memory
      - os.disk
      - os.packages
      - os.cron
      - process.list
      - process.inspect
      - process.tree
      - filesystem.mounts
      - filesystem.inodes
      - filesystem.pressure
      - filesystem.mount_status
      - filesystem.path_metadata
      - filesystem.usage_summary
      - filesystem.log_growth
      - network.interfaces
      - network.routes
      - network.dns_resolve
      - network.listener
      - network.tls_certificate
      # network.firewall_summary requires separately reviewed local read access.
    remediation_actions: []
    # The matching probe_targets entry must be added to private inventory first.
    allowed_probe_targets: [service_health]
    # Add reviewed aliases only after adding matching storage_targets in private inventory.
    allowed_storage_targets: []
    allowed_storage_paths: ["/"] # Explicitly permits legacy os.disk/filesystem.inodes root checks only.
    allowed_units:
      - nginx.service
  example-app-01:
    diagnostic_actions: [systemd.is_active, systemd.service_status, systemd.failed_units, systemd.journal_summary, systemd.timers, os.uptime, os.cpu, os.release, os.memory, os.disk, os.packages, os.cron, process.list, process.inspect, process.tree, filesystem.mounts, filesystem.inodes, network.tcp_connect, network.tls_certificate, filesystem.pressure, application.health, application.queue_health, application.config_fingerprint, application.deploy_version]
    remediation_actions: []
    allowed_storage_paths: ["/"]
    # Add reviewed IDs only after registering exact sources in private inventory.
    allowed_applications: []
    allowed_probe_targets: []
    allowed_storage_targets: []
    allowed_units: [runbookos-sample.service]
  example-db-01:
    diagnostic_actions: [systemd.is_active, systemd.service_status, systemd.failed_units, systemd.journal_summary, systemd.timers, os.uptime, os.cpu, os.release, os.memory, os.disk, os.packages, os.cron, process.list, filesystem.mounts, filesystem.inodes]
    remediation_actions: []
    allowed_storage_paths: ["/"]
    allowed_units: [postgresql.service]
    # Explicitly allow each SQL check and exact database endpoint only after
    # provisioning a read-only role and private pgpass on the database host.
    # diagnostic_actions: [postgresql.protocol_available, postgresql.inspect]
    # allowed_probe_targets: [db_main]
  example-net-01:
    diagnostic_actions: [systemd.is_active, systemd.service_status, systemd.failed_units, systemd.journal_summary, systemd.timers, os.uptime, os.cpu, os.release, os.memory, os.disk, os.packages, os.cron, process.list, filesystem.mounts, filesystem.inodes, network.interfaces, network.routes]
    remediation_actions: []
    allowed_storage_paths: ["/"]
    allowed_units: [nftables.service]
