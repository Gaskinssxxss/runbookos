name: Validate RunbookOS
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: |
          python -m pip install -r requirements-ci-py312.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit and integration tests
        run: pytest --cov=runbookos --cov-report=term-missing --cov-fail-under=70
      - name: Validate example runbooks
        run: |
          for runbook in examples/runbooks/*.yml; do runbookos validate "$runbook"; done
      - name: Build distributable wheel
        run: python -m build --wheel --sdist
      - name: Verify release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tarfile import open as tar_open
          wheel = next(Path("dist").glob("runbookos-*.whl"))
          sdist = next(Path("dist").glob("runbookos-*.tar.gz"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(name.endswith("runbookos/ssh.py") for name in names)
              assert any(name.endswith("runbookos/dashboard.py") for name in names)
              assert any(name.endswith("runbookos/adapters/alertmanager_bridge.py") for name in names)
              assert any(name.endswith("share/runbookos/examples/alertmanager/receiver.example.yml") for name in names)
              assert any(name.endswith("runbookos-0.5.0.dist-info/entry_points.txt") for name in names)
              assert any(name.endswith("runbookos-0.5.0.dist-info/METADATA") for name in names)
              assert not any("homelab" in name for name in names)
              assert not any("reports/" in name or ".sqlite" in name for name in names)
          with tar_open(sdist, "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/src/runbookos/ssh.py") for name in names)
              assert any(name.endswith("/README.md") for name in names)
              assert any(name.endswith("/docs/security.md") for name in names)
              assert any(name.endswith("/docs/dashboard-security-v0.4.0.md") for name in names)
              assert any(name.endswith("/docs/dashboard-walkthrough-v0.4.0.md") for name in names)
              assert any(name.endswith("/docs/dashboard-staging-acceptance-v0.4.0.md") for name in names)
              assert any(name.endswith("/docs/dashboard-staging-approval-v0.4.0.yml") for name in names)
              assert any(name.endswith("/docs/release-review-v0.4.0.md") for name in names)
              assert any(name.endswith("/docs/dashboard-patch-v0.4.1.md") for name in names)
              assert any(name.endswith("/docs/remediation-security-v0.5.0.md") for name in names)
              assert any(name.endswith("/docs/implementation-report-v0.5.0.md") for name in names)
              assert any(name.endswith("/docs/remediation-acceptance-v0.5.0.md") for name in names)
              assert any(name.endswith("/docs/disposable-remediation-approval-v0.5.0.yml") for name in names)
              assert any(name.endswith("/examples/runbooks/disposable-systemd-restart.yml") for name in names)
              assert any(name.endswith("/tests/test_store_ssh.py") for name in names)
              assert any(name.endswith("/tests/test_remediation.py") for name in names)
              assert any(name.endswith("/scripts/staging-v032.py") for name in names)
              assert any(name.endswith("/tests/test_alertmanager_bridge.py") for name in names)
              assert any(name.endswith("/docs/implementation-report-v0.3.2.md") for name in names)
              assert any(name.endswith("/docs/staging-acceptance-v0.3.2.md") for name in names)
              assert not any("homelab" in name for name in names)
              assert not any("reports/" in name or ".sqlite" in name for name in names)
          print(f"wheel={wheel} bytes={wheel.stat().st_size}")
          print(f"sdist={sdist} bytes={sdist.stat().st_size}")
          PY
          sha256sum dist/*
      - name: Verify installed wheel version parity
        run: |
          python -m pip uninstall -y runbookos
          python -m pip install --no-deps dist/runbookos-0.5.0-py3-none-any.whl
          python -c 'from importlib.metadata import version; import runbookos; assert version("runbookos") == runbookos.__version__ == "0.5.0"'
          runbookos version
