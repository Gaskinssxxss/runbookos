name: PR Review Preflight (manual, no AI)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number for read-only metadata checks"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: pr-review-preflight-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Review PR metadata without checking out PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_REPO: ${{ github.repository }}
        run: python scripts/pr_review_preflight.py --repo "$TARGET_REPO" --pr "$PR_NUMBER"
